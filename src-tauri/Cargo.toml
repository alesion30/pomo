[package]
name = "pomo"
version = "0.1.0"
description = "Personal pomodoro timer for macOS"
edition = "2024"


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pomo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-wdio-webdriver = "1.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
tauri-plugin-notification = "2.8.1"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSScreen", "NSEvent", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-window-state = "2.5.0"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
